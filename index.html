<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topological Sort — Algorithm Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  :root {
    --bg: #f0ede6;
    --surface: #f8f6f1;
    --surface2: #ece9e2;
    --border: rgba(0,0,0,0.09);
    --border-hover: rgba(0,0,0,0.18);
    --text: #2a2825;
    --text-muted: #6b6660;
    --text-dim: #b0aba4;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
 
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }
 
  .page-header { text-align: center; margin-bottom: 3rem; }
  .page-header h1 {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 0.4rem;
  }
  .page-header p { font-size: 13px; color: var(--text-muted); letter-spacing: 0.04em; }
 
  .container { max-width: 780px; margin: 0 auto; }
 
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 24px; background: transparent; border: none;
    border-bottom: 2px solid transparent; color: var(--text-muted);
    cursor: pointer; font-family: var(--font-mono); font-size: 13px;
    font-weight: 500; letter-spacing: 0.04em; transition: all 0.2s; margin-bottom: -1px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: #3a6a10; border-bottom-color: #5a9020; }
 
  .panel { display: none; }
  .panel.active { display: block; }
 
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-top: none; border-radius: 0 0 12px 12px; padding: 1.5rem;
  }
 
  svg.graph { display: block; width: 100%; }
 
  .meta-row { display: flex; gap: 1.5rem; margin-top: 1.2rem; flex-wrap: wrap; }
  .meta-block { flex: 1; min-width: 200px; }
  .meta-label {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 6px;
  }
 
  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-family: var(--font-mono); font-size: 12px; padding: 4px 10px;
    border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text-muted); transition: all 0.25s;
  }
  .badge.zero { background: #e8e6f8; border-color: #9990d0; color: #4a4490; }
 
  .out-nodes { display: flex; gap: 6px; flex-wrap: wrap; }
  .out-node {
    width: 38px; height: 38px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 500; font-family: var(--font-display);
    border: 1px solid var(--border); background: var(--surface2);
    color: var(--text-dim); transition: all 0.3s;
  }
  .out-node.done { background: #bbf7d0; border-color: #16a34a; color: #14532d; }
 
  .stack-nodes { display: flex; gap: 6px; flex-wrap: wrap; }
  .stack-node {
    width: 38px; height: 38px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 500; font-family: var(--font-display);
    background: #dbeafe; border: 1px solid #3b82f6; color: #1e3a8a;
    animation: pop-in 0.2s ease;
  }
 
  @keyframes pop-in {
    from { transform: scale(0.7); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
 
  .ctrl-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 1.4rem; padding-top: 1.2rem; border-top: 1px solid var(--border);
  }
  .btn {
    padding: 7px 18px; border-radius: 8px; border: 1px solid var(--border-hover);
    background: transparent; color: var(--text); cursor: pointer;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; transition: all 0.15s;
  }
  .btn:hover { background: var(--surface2); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .btn.primary { background: #eaf4d8; border-color: #9abf66; color: #3a6a10; }
  .btn.primary:hover { background: #d0eaa8; }
 
  .step-info {
    flex: 1; font-size: 12px; color: var(--text-muted); padding: 8px 12px;
    background: var(--surface2); border-radius: 8px; border: 1px solid var(--border);
    line-height: 1.5; min-height: 36px; display: flex; align-items: center;
  }
 
  .legend {
    display: flex; gap: 16px; flex-wrap: wrap;
    margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);
  }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
  .leg-swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid transparent; }
</style>
</head>
<body>
 
<div class="page-header">
  <h1>Topological Sort</h1>
  <p>step-by-step algorithm visualizer</p>
</div>
 
<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('kahns')">Kahn's (BFS)</button>
    <button class="tab" onclick="switchTab('dfs')">DFS (reverse postorder)</button>
  </div>
 
  <div id="panel-kahns" class="panel active">
    <div class="card">
      <svg id="svg-kahns" class="graph" viewBox="0 0 680 220"></svg>
      <div class="meta-row">
        <div class="meta-block">
          <div class="meta-label">In-degrees</div>
          <div class="badge-row" id="k-indegs"></div>
        </div>
        <div class="meta-block">
          <div class="meta-label">Output</div>
          <div class="out-nodes" id="k-output"></div>
        </div>
      </div>
      <div class="ctrl-row">
        <button class="btn" onclick="kReset()">Reset</button>
        <button class="btn primary" id="k-next-btn" onclick="kNext()">Next step →</button>
        <div class="step-info" id="k-info"></div>
      </div>
      <div class="legend">
        <div class="leg-item"><div class="leg-swatch" style="background:#eaf4d8;border-color:#9abf66"></div> Unvisited</div>
        <div class="leg-item"><div class="leg-swatch" style="background:#e8e6f8;border-color:#9990d0"></div> In queue</div>
        <div class="leg-item"><div class="leg-swatch" style="background:#fef3c7;border-color:#d97706"></div> Current</div>
        <div class="leg-item"><div class="leg-swatch" style="background:#bbf7d0;border-color:#16a34a"></div> Done</div>
      </div>
    </div>
  </div>
 
  <div id="panel-dfs" class="panel">
    <div class="card">
      <svg id="svg-dfs" class="graph" viewBox="0 0 680 220"></svg>
      <div class="meta-row">
        <div class="meta-block">
          <div class="meta-label">Call stack</div>
          <div class="stack-nodes" id="dfs-stack"></div>
        </div>
        <div class="meta-block">
          <div class="meta-label">Output (pop order)</div>
          <div class="out-nodes" id="d-output"></div>
        </div>
      </div>
      <div class="ctrl-row">
        <button class="btn" onclick="dReset()">Reset</button>
        <button class="btn primary" id="d-next-btn" onclick="dNext()">Next step →</button>
        <div class="step-info" id="d-info"></div>
      </div>
      <div class="legend">
        <div class="leg-item"><div class="leg-swatch" style="background:#eaf4d8;border-color:#9abf66"></div> Unvisited</div>
        <div class="leg-item"><div class="leg-swatch" style="background:#fef3c7;border-color:#d97706"></div> Visiting</div>
        <div class="leg-item"><div class="leg-swatch" style="background:#dbeafe;border-color:#3b82f6"></div> On stack</div>
        <div class="leg-item"><div class="leg-swatch" style="background:#bbf7d0;border-color:#16a34a"></div> Done</div>
      </div>
    </div>
  </div>
</div>
 
<script>
const NODES = {
  A:{x:80,y:90},  B:{x:80,y:160},
  C:{x:250,y:50},  D:{x:350,y:130},
  E:{x:350,y:190}, F:{x:540,y:100}
};
const EDGES = [['A','C'],['A','D'],['B','D'],['B','E'],['C','F'],['D','F'],['E','F']];
 
const COLORS = {
  default:  { fill:'#eaf4d8', stroke:'#9abf66', text:'#4a7a1a', sw:1 },
  queue:    { fill:'#e8e6f8', stroke:'#9990d0', text:'#4a4490', sw:2 },
  current:  { fill:'#fef3c7', stroke:'#d97706', text:'#78350f', sw:2.5 },
  instack:  { fill:'#dbeafe', stroke:'#3b82f6', text:'#1e3a8a', sw:2 },
  visiting: { fill:'#fef3c7', stroke:'#d97706', text:'#78350f', sw:2 },
  done:     { fill:'#bbf7d0', stroke:'#16a34a', text:'#14532d', sw:1.5 },
};
 
function drawGraph(svgId, nodeStates) {
  const svg = document.getElementById(svgId);
  const edgeColor = 'rgba(0,0,0,0.2)';
  let h = `<defs><marker id="a${svgId}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="${edgeColor}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>`;
 
  for (const [a,b] of EDGES) {
    const n1=NODES[a], n2=NODES[b];
    const dx=n2.x-n1.x, dy=n2.y-n1.y, len=Math.sqrt(dx*dx+dy*dy);
    const ux=dx/len, uy=dy/len;
    const x1=n1.x+ux*26, y1=n1.y+uy*26, x2=n2.x-ux*26, y2=n2.y-uy*26;
    h += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${edgeColor}" stroke-width="1.2" marker-end="url(#a${svgId})"/>`;
  }
 
  for (const [name, state] of Object.entries(nodeStates)) {
    const {x,y} = NODES[name];
    const c = COLORS[state] || COLORS.default;
    h += `<rect x="${x-26}" y="${y-21}" width="52" height="42" rx="10" fill="${c.fill}" stroke="${c.stroke}" stroke-width="${c.sw}"/>`;
    h += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="${c.text}" font-family="'Syne', sans-serif">${name}</text>`;
  }
 
  svg.innerHTML = h;
}
 
function switchTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  if (t === 'kahns') {
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.getElementById('panel-kahns').classList.add('active');
  } else {
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('panel-dfs').classList.add('active');
  }
}
 
const kSteps = [
  { states:{A:'queue',B:'queue',C:'default',D:'default',E:'default',F:'default'}, info:'In-degree 0 → enqueue A and B. Queue: [A, B]', indegs:{A:0,B:0,C:1,D:2,E:1,F:3}, out:[] },
  { states:{A:'current',B:'queue',C:'default',D:'default',E:'default',F:'default'}, info:'Dequeue A → add to output. Reduce in-degree: C (→0), D (→1).', indegs:{A:'✓',B:0,C:0,D:1,E:1,F:3}, out:['A'] },
  { states:{A:'done',B:'queue',C:'queue',D:'default',E:'default',F:'default'}, info:'C hit 0 → enqueue C. Queue: [B, C]', indegs:{A:'✓',B:0,C:0,D:1,E:1,F:3}, out:['A'] },
  { states:{A:'done',B:'current',C:'queue',D:'default',E:'default',F:'default'}, info:'Dequeue B → add to output. Reduce in-degree: D (→0), E (→0).', indegs:{A:'✓',B:'✓',C:0,D:0,E:0,F:3}, out:['A','B'] },
  { states:{A:'done',B:'done',C:'queue',D:'queue',E:'queue',F:'default'}, info:'D and E hit 0 → enqueue both. Queue: [C, D, E]', indegs:{A:'✓',B:'✓',C:0,D:0,E:0,F:3}, out:['A','B'] },
  { states:{A:'done',B:'done',C:'current',D:'queue',E:'queue',F:'default'}, info:'Dequeue C → add to output. Reduce in-degree: F (→2).', indegs:{A:'✓',B:'✓',C:'✓',D:0,E:0,F:2}, out:['A','B','C'] },
  { states:{A:'done',B:'done',C:'done',D:'current',E:'queue',F:'default'}, info:'Dequeue D → add to output. Reduce in-degree: F (→1).', indegs:{A:'✓',B:'✓',C:'✓',D:'✓',E:0,F:1}, out:['A','B','C','D'] },
  { states:{A:'done',B:'done',C:'done',D:'done',E:'current',F:'default'}, info:'Dequeue E → add to output. Reduce in-degree: F (→0).', indegs:{A:'✓',B:'✓',C:'✓',D:'✓',E:'✓',F:0}, out:['A','B','C','D','E'] },
  { states:{A:'done',B:'done',C:'done',D:'done',E:'done',F:'queue'}, info:'F hit 0 → enqueue F. Queue: [F]', indegs:{A:'✓',B:'✓',C:'✓',D:'✓',E:'✓',F:0}, out:['A','B','C','D','E'] },
  { states:{A:'done',B:'done',C:'done',D:'done',E:'done',F:'done'}, info:'Dequeue F → add to output. Queue empty. Done! Result: A B C D E F', indegs:{A:'✓',B:'✓',C:'✓',D:'✓',E:'✓',F:'✓'}, out:['A','B','C','D','E','F'] },
];
 
const dSteps = [
  { states:{A:'default',B:'default',C:'default',D:'default',E:'default',F:'default'}, info:'Start DFS from A (first unvisited node).', stack:[], out:[] },
  { states:{A:'visiting',B:'default',C:'default',D:'default',E:'default',F:'default'}, info:'Visit A. Recurse into neighbors: C, then D.', stack:[], out:[] },
  { states:{A:'visiting',B:'default',C:'visiting',D:'default',E:'default',F:'default'}, info:'Visit C. Recurse into C\'s neighbor: F.', stack:[], out:[] },
  { states:{A:'visiting',B:'default',C:'visiting',D:'default',E:'default',F:'visiting'}, info:'Visit F. No unvisited neighbors. Push F onto stack.', stack:['F'], out:[] },
  { states:{A:'visiting',B:'default',C:'visiting',D:'default',E:'default',F:'instack'}, info:'Back at C. All neighbors done. Push C onto stack.', stack:['F','C'], out:[] },
  { states:{A:'visiting',B:'default',C:'instack',D:'visiting',E:'default',F:'instack'}, info:'Back at A, now visit D. D\'s neighbor F is already visited.', stack:['F','C'], out:[] },
  { states:{A:'visiting',B:'default',C:'instack',D:'instack',E:'default',F:'instack'}, info:'D fully explored. Push D onto stack.', stack:['F','C','D'], out:[] },
  { states:{A:'instack',B:'default',C:'instack',D:'instack',E:'default',F:'instack'}, info:'Back at A. All neighbors done. Push A onto stack.', stack:['F','C','D','A'], out:[] },
  { states:{A:'instack',B:'visiting',C:'instack',D:'instack',E:'default',F:'instack'}, info:'Next unvisited: B. Visit B. D is visited; recurse into E.', stack:['F','C','D','A'], out:[] },
  { states:{A:'instack',B:'visiting',C:'instack',D:'instack',E:'visiting',F:'instack'}, info:'Visit E. E\'s neighbor F is already visited. Push E onto stack.', stack:['F','C','D','A','E'], out:[] },
  { states:{A:'instack',B:'instack',C:'instack',D:'instack',E:'instack',F:'instack'}, info:'Back at B. All neighbors done. Push B. Stack complete — ready to pop!', stack:['F','C','D','A','E','B'], out:[] },
  { states:{A:'done',B:'done',C:'done',D:'done',E:'done',F:'done'}, info:'Pop stack top→bottom → B, E, A, D, C, F. That\'s the topological order!', stack:[], out:['B','E','A','D','C','F'] },
];
 
let kStep = 0, dStep = 0;
 
function kRender() {
  const s = kSteps[kStep];
  drawGraph('svg-kahns', s.states);
  document.getElementById('k-info').textContent = s.info;
  const indegsEl = document.getElementById('k-indegs');
  indegsEl.innerHTML = '';
  for (const [n, v] of Object.entries(s.indegs)) {
    const b = document.createElement('span');
    b.className = 'badge' + (v === 0 ? ' zero' : '');
    b.textContent = n + ': ' + v;
    indegsEl.appendChild(b);
  }
  const outEl = document.getElementById('k-output');
  outEl.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const d = document.createElement('div');
    if (i < s.out.length) { d.className = 'out-node done'; d.textContent = s.out[i]; }
    else { d.className = 'out-node'; d.textContent = '-'; }
    outEl.appendChild(d);
  }
  document.getElementById('k-next-btn').disabled = kStep >= kSteps.length - 1;
}
 
function kNext() { if (kStep < kSteps.length - 1) { kStep++; kRender(); } }
function kReset() { kStep = 0; kRender(); }
 
function dRender() {
  const s = dSteps[dStep];
  drawGraph('svg-dfs', s.states);
  document.getElementById('d-info').textContent = s.info;
  const stackEl = document.getElementById('dfs-stack');
  stackEl.innerHTML = '';
  if (s.stack.length === 0) {
    const e = document.createElement('span');
    e.style.cssText = 'font-size:12px;color:var(--text-dim)';
    e.textContent = '(empty)';
    stackEl.appendChild(e);
  } else {
    s.stack.forEach(n => {
      const d = document.createElement('div');
      d.className = 'stack-node';
      d.textContent = n;
      stackEl.appendChild(d);
    });
  }
  const outEl = document.getElementById('d-output');
  outEl.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const d = document.createElement('div');
    if (i < s.out.length) { d.className = 'out-node done'; d.textContent = s.out[i]; }
    else { d.className = 'out-node'; d.textContent = '-'; }
    outEl.appendChild(d);
  }
  document.getElementById('d-next-btn').disabled = dStep >= dSteps.length - 1;
}
 
function dNext() { if (dStep < dSteps.length - 1) { dStep++; dRender(); } }
function dReset() { dStep = 0; dRender(); }
 
kRender();
dRender();
</script>
</body>
</html>
